<svg xmlns="http://www.w3.org/2000/svg" width="300" height="340" viewBox="0 0 300 340"><defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16212b" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#04070a" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f5"/>
      <stop offset="0.5" stop-color="#3adcf2"/>
      <stop offset="1" stop-color="#f2f4f5" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
</defs>
  <rect x="40" y="40" width="220" height="250" rx="70" fill="none" stroke="#3adcf2" stroke-width="10" opacity="0.3" filter="url(#glow)"/>
  <g filter="url(#shadow)"><rect x="40" y="40" width="220" height="250" rx="70" fill="url(#glass)"/></g>
