<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320"><defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16212b" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#04070a" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f5"/>
      <stop offset="0.5" stop-color="#3adcf2"/>
      <stop offset="1" stop-color="#f2f4f5" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
</defs>
  <circle cx="160" cy="160" r="136" fill="none" stroke="#3adcf2" stroke-width="14" opacity="0.35" filter="url(#glow)"/>
  <g filter="url(#shadow)"><circle cx="160" cy="160" r="128" fill="#05080b" fill-opacity="0.7"/></g>
  <circle cx="160" cy="160" r="128" fill="none" stroke="url(#edge)" stroke-width="5"/>
  <ellipse cx="160" cy="100" rx="96" ry="52" fill="url(#gloss)"/>
  <text x="160" y="182" text-anchor="middle" font-family="Orbitron Bold" font-size="56" letter-spacing="4" fill="#f2f4f5">NATL</text></svg>
