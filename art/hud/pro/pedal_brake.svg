<svg xmlns="http://www.w3.org/2000/svg" width="560" height="520" viewBox="0 0 560 520">
  <defs>
    <!-- Brushed aluminium: vertical streak noise over a cool grey ramp. -->
    <filter id="brushed" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.004" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.55 0" result="streaks"/>
      <feBlend in="SourceGraphic" in2="streaks" mode="soft-light" result="lit"/>
      <feComposite in="lit" in2="SourceAlpha" operator="in"/>
    </filter>
    <!-- Bevel: light from the top left on the plate's edge. -->
    <filter id="bevel" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.9" specularExponent="22" lighting-color="#ffffff" result="spec">
        <fePointLight x="-300" y="-500" z="420"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.55" k4="0"/>
    </filter>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <!-- Rubber: fine grain and an inner shadow at the top edge. -->
    <filter id="rubber" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" seed="3" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.12  0 0 0 0 0.13  0 0 0 0.6 0" result="grainC"/>
      <feComposite in="grainC" in2="SourceAlpha" operator="in" result="grainIn"/>
      <feMerge result="body"><feMergeNode in="SourceGraphic"/><feMergeNode in="grainIn"/></feMerge>
      <feOffset in="SourceAlpha" dy="5" result="off"/>
      <feComposite in="SourceAlpha" in2="off" operator="out" result="rim"/>
      <feFlood flood-color="#000" flood-opacity="0.8"/>
      <feComposite in2="rim" operator="in" result="inner"/>
      <feMerge><feMergeNode in="body"/><feMergeNode in="inner"/></feMerge>
    </filter>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/>
      <stop offset="0.35" stop-color="#c9ced6"/>
      <stop offset="0.62" stop-color="#9aa1ab"/>
      <stop offset="1" stop-color="#6c727c"/>
    </linearGradient>
    <linearGradient id="rubberG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2b2e"/>
      <stop offset="1" stop-color="#121314"/>
    </linearGradient>
    <radialGradient id="bolt" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#a7adb5"/>
      <stop offset="1" stop-color="#3e434a"/>
    </radialGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="plateClip"><rect x="30" y="20" width="500" height="460" rx="46"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <g filter="url(#bevel)">
      <rect x="30" y="20" width="500" height="460" rx="46" fill="url(#alu)" filter="url(#brushed)"/>
    </g>
  </g>
  <!-- A soft diagonal sheen across the metal. -->
  <g clip-path="url(#plateClip)" opacity="0.8">
    <rect x="-200" y="60" width="1000" height="80" fill="url(#glare)" transform="rotate(-38 280 260)"/>
  </g>
  <!-- Edge line. -->
  <rect x="31.5" y="21.5" width="497" height="457" rx="45" fill="none" stroke="#3b4048" stroke-width="3"/>
  <rect x="38" y="28" width="484" height="444" rx="40" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Rubber grip strips. -->
  <g filter="url(#rubber)">
    <rect x="96" y="70" width="368" height="52" rx="26" fill="url(#rubberG)"/>
    <rect x="96" y="150" width="368" height="52" rx="26" fill="url(#rubberG)"/>
    <rect x="96" y="318" width="368" height="52" rx="26" fill="url(#rubberG)"/>
    <rect x="96" y="398" width="368" height="52" rx="26" fill="url(#rubberG)"/>
  </g>

  <!-- Engraved word: a dark cut with a light lower lip. -->
  <g font-family="Oswald Bold" font-size="84" text-anchor="middle" letter-spacing="10">
    <text x="282" y="291" fill="#ffffff" fill-opacity="0.55">BRAKE</text>
    <text x="280" y="287" fill="#2c3036">BRAKE</text>
  </g>

  <!-- Bolts in the four corners. -->
  <g>
    <circle cx="66" cy="56" r="15" fill="url(#bolt)" stroke="#2a2e33" stroke-width="2"/>
    <circle cx="494" cy="56" r="15" fill="url(#bolt)" stroke="#2a2e33" stroke-width="2"/>
    <circle cx="66" cy="444" r="15" fill="url(#bolt)" stroke="#2a2e33" stroke-width="2"/>
    <circle cx="494" cy="444" r="15" fill="url(#bolt)" stroke="#2a2e33" stroke-width="2"/>
    <g stroke="#2a2e33" stroke-width="4" stroke-linecap="round">
      <path d="M58 56h16M66 48v16"/><path d="M486 56h16M494 48v16"/>
      <path d="M58 444h16M66 436v16"/><path d="M486 444h16M494 436v16"/>
    </g>
  </g>
</svg>
