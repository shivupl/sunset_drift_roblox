<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/></filter>
    <filter id="dome" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="h"/>
      <feSpecularLighting in="h" surfaceScale="10" specularConstant="0.8" specularExponent="22" lighting-color="#fff" result="spec"><feDistantLight azimuth="225" elevation="45"/></feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="sp"/>
      <feComposite in="SourceGraphic" in2="sp" operator="arithmetic" k1="0" k2="1" k3="0.45" k4="0"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.4" stop-color="#9aa0a8"/><stop offset="0.6" stop-color="#eceef1"/><stop offset="1" stop-color="#4f545b"/></linearGradient>
    <radialGradient id="face" cx="0.45" cy="0.4" r="0.7"><stop offset="0" stop-color="#3a2a14"/><stop offset="1" stop-color="#150d04"/></radialGradient>
  </defs>
  <g filter="url(#shadow)"><circle cx="160" cy="160" r="140" fill="url(#chrome)" filter="url(#dome)"/></g>
  <circle cx="160" cy="160" r="116" fill="url(#face)" filter="url(#dome)"/>
  <circle cx="160" cy="104" r="16" fill="#ffba5c" opacity="0.9" filter="url(#glow)"/>
  <circle cx="160" cy="104" r="9" fill="#ffba5c" stroke="#000" stroke-opacity="0.5" stroke-width="2"/>
  <text x="160" y="196" text-anchor="middle" font-family="Oswald Bold" font-size="62" letter-spacing="5" fill="#ffd9a3">NATL</text>
</svg>
