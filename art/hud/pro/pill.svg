<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120">
  <defs>
    <filter id="bevel" x="-5%" y="-10%" width="110%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="h"/>
      <feSpecularLighting in="h" surfaceScale="4" specularConstant="0.7" specularExponent="18" lighting-color="#fff" result="spec"><feDistantLight azimuth="225" elevation="50"/></feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="sp"/>
      <feComposite in="SourceGraphic" in2="sp" operator="arithmetic" k1="0" k2="1" k3="0.35" k4="0"/>
    </filter>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f45"/><stop offset="1" stop-color="#16181b"/></linearGradient>
  </defs>
  <rect x="6" y="6" width="288" height="108" rx="54" fill="url(#g)" filter="url(#bevel)" fill-opacity="0.92"/>
  <rect x="7.5" y="7.5" width="285" height="105" rx="52.5" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="3"/>
  <rect x="12" y="12" width="276" height="96" rx="48" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="2"/>
</svg>
