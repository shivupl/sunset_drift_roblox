<svg xmlns="http://www.w3.org/2000/svg" width="300" height="340" viewBox="0 0 300 340">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#000" flood-opacity="0.6"/></filter>
    <filter id="tube" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="h"/>
      <feSpecularLighting in="h" surfaceScale="8" specularConstant="0.75" specularExponent="18" lighting-color="#fff" result="spec"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="sp"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="1" seed="4" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.12  0 0 0 0 0.13  0 0 0 0.5 0" result="gc"/>
      <feComposite in="gc" in2="SourceAlpha" operator="in" result="gi"/>
      <feMerge result="b"><feMergeNode in="SourceGraphic"/><feMergeNode in="gi"/></feMerge>
      <feComposite in="b" in2="sp" operator="arithmetic" k1="0" k2="1" k3="0.4" k4="0"/>
    </filter>
    <filter id="groove" x="-5%" y="-30%" width="110%" height="160%">
      <feOffset in="SourceAlpha" dy="3" result="off"/><feComposite in="SourceAlpha" in2="off" operator="out" result="rim"/>
      <feFlood flood-color="#fff" flood-opacity="0.18"/><feComposite in2="rim" operator="in" result="lip"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="lip"/></feMerge>
    </filter>
    <linearGradient id="rubber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#121315"/><stop offset="0.45" stop-color="#2f3135"/><stop offset="1" stop-color="#0d0e10"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.4" stop-color="#9aa0a8"/><stop offset="0.6" stop-color="#eceef1"/><stop offset="1" stop-color="#4f545b"/></linearGradient>
  </defs>
  <g filter="url(#shadow)">
    <rect x="50" y="50" width="200" height="262" rx="70" fill="url(#rubber)" filter="url(#tube)"/>
    <ellipse cx="150" cy="58" rx="84" ry="40" fill="url(#chrome)" filter="url(#tube)"/>
  </g>
  <ellipse cx="150" cy="56" rx="52" ry="22" fill="#d9dde2" stroke="#6b7178" stroke-width="3"/>
  <ellipse cx="150" cy="54" rx="40" ry="14" fill="#ffba5c" fill-opacity="0.9"/>
  <g filter="url(#groove)" fill="#08090a">
    <rect x="72" y="128" width="156" height="12" rx="6"/><rect x="70" y="160" width="160" height="12" rx="6"/>
    <rect x="70" y="192" width="160" height="12" rx="6"/><rect x="72" y="224" width="156" height="12" rx="6"/>
  </g>
  <text x="150" y="292" text-anchor="middle" font-family="Oswald Bold" font-size="40" letter-spacing="6" fill="#d7dade" fill-opacity="0.9">HAND</text>
</svg>
