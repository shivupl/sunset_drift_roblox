<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><defs>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
<linearGradient id="knobg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#e3e9ef"/><stop offset="1" stop-color="#aebbc7"/></linearGradient></defs>
  <g filter="url(#shadow)">
    <circle cx="200" cy="212" r="170" fill="#7d8a96" stroke="#0f1418" stroke-width="12"/>
    <circle cx="200" cy="200" r="170" fill="url(#knobg)" stroke="#0f1418" stroke-width="12"/>
  </g>
