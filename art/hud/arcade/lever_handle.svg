<svg xmlns="http://www.w3.org/2000/svg" width="300" height="340" viewBox="0 0 300 340"><defs>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
<linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd08a"/><stop offset="0.55" stop-color="#ff9f1c"/><stop offset="1" stop-color="#d97a00"/></linearGradient></defs>
  <g filter="url(#shadow)">
    <rect x="40" y="56" width="220" height="240" rx="80" fill="#a35a00" stroke="#0f1418" stroke-width="10"/>
    <rect x="40" y="40" width="220" height="240" rx="80" fill="url(#orange)" stroke="#0f1418" stroke-width="10"/>
  </g>
  <rect x="62" y="56" width="176" height="72" rx="64" fill="url(#gloss)"/>
  <text x="150" y="210" text-anchor="middle" font-family="Fredoka Bold" font-size="64" letter-spacing="2" fill="#0f1418" stroke="#0f1418" stroke-width="12" stroke-linejoin="round">HAND</text>
  <text x="150" y="210" text-anchor="middle" font-family="Fredoka Bold" font-size="64" letter-spacing="2" fill="#fbfbf7">HAND</text></svg>
